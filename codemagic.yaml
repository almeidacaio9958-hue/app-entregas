workflows:
  android-workflow:
    name: Build App Entregas
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean and Prepare
        script: |
          rm -rf android/app/src/main/java/io/flutter/plugins
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - almeidacaio9958@gmail.com
        notify:
          failure: true
          success: true
